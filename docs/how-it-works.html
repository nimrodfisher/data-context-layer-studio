<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #eceae3; }
  .wrap { position: absolute; top: 0; left: 0; width: 1440px; height: 820px; background: #FCFCF8; transform: scale(0.82); transform-origin: 0 0; }
  svg { display: block; }
  .h  { font-family: "Caveat", cursive; }
</style>
</head>
<body>
<div class="wrap">
<svg width="1440" height="820" viewBox="0 0 1440 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M1,1 L8,4 L1,7" fill="none" stroke="#2b2f38" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- shapes: hand-drawn wobble via filter -->
  <g filter="url(#rough)" fill="none" stroke="#2b2f38" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- pipeline boxes -->
    <rect x="48"   y="196" width="292" height="128" rx="14" fill="#E7ECFF"/>
    <rect x="398"  y="196" width="292" height="128" rx="14" fill="#E7ECFF"/>
    <rect x="748"  y="196" width="292" height="128" rx="14" fill="#E7ECFF"/>
    <rect x="1098" y="196" width="292" height="128" rx="14" fill="#DDE9FF"/>
    <!-- arrows between pipeline boxes -->
    <line x1="342" y1="260" x2="394" y2="260" marker-end="url(#ah)"/>
    <line x1="692" y1="260" x2="744" y2="260" marker-end="url(#ah)"/>
    <line x1="1042" y1="260" x2="1094" y2="260" marker-end="url(#ah)"/>
    <!-- down arrow to agent banner -->
    <line x1="720" y1="330" x2="720" y2="400" marker-end="url(#ah)"/>
    <!-- agent banner -->
    <rect x="360" y="404" width="720" height="96" rx="16" fill="#FFF3D4"/>
    <!-- arrows to outcomes -->
    <line x1="560" y1="504" x2="470" y2="576" marker-end="url(#ah)"/>
    <line x1="880" y1="504" x2="970" y2="576" marker-end="url(#ah)"/>
    <!-- outcome boxes -->
    <rect x="120" y="582" width="560" height="150" rx="16" fill="#E4F7EE"/>
    <rect x="760" y="582" width="560" height="150" rx="16" fill="#FCE7E7"/>
  </g>

  <!-- text: crisp, hand-drawn font -->
  <g class="h" fill="#23272f" text-anchor="middle">
    <!-- title -->
    <text x="70" y="86" font-size="52" font-weight="700" text-anchor="start">How it works</text>
    <text x="72" y="128" font-size="26" font-weight="500" text-anchor="start" fill="#5b6472">Grounding AI agents in your data — a map, not a guess.</text>

    <!-- pipeline labels -->
    <text x="194" y="250" font-size="27" font-weight="700">Your scattered</text>
    <text x="194" y="280" font-size="27" font-weight="700">knowledge</text>
    <text x="194" y="308" font-size="19" font-weight="500" fill="#5b6472">docs · dbt · warehouse · Slack</text>

    <text x="544" y="250" font-size="27" font-weight="700">Gather &amp; validate</text>
    <text x="544" y="282" font-size="19" font-weight="500" fill="#5b6472">chat interview</text>
    <text x="544" y="306" font-size="19" font-weight="500" fill="#5b6472">or guided web UI</text>

    <text x="894" y="250" font-size="27" font-weight="700">One canonical project</text>
    <text x="894" y="282" font-size="19" font-weight="500" fill="#5b6472">provenance on every fact</text>
    <text x="894" y="306" font-size="19" font-weight="500" fill="#5b6472">no evidence → not shipped</text>

    <text x="1244" y="248" font-size="27" font-weight="700" fill="#2540d0">Domain skill</text>
    <text x="1244" y="280" font-size="19" font-weight="500" fill="#5b6472">SKILL.md + leaf files</text>
    <text x="1244" y="304" font-size="19" font-weight="500" fill="#5b6472">metrics · caveats · queries</text>

    <!-- agent banner -->
    <text x="720" y="446" font-size="30" font-weight="700">Your AI agent loads the skill</text>
    <text x="720" y="480" font-size="30" font-weight="700">BEFORE it answers a data question</text>

    <!-- outcomes -->
    <text x="400" y="628" font-size="30" font-weight="700" fill="#1f9268">✓ With it</text>
    <text x="400" y="662" font-size="21" font-weight="500" fill="#2b6a52">signed metric · caveat applied ·</text>
    <text x="400" y="690" font-size="21" font-weight="500" fill="#2b6a52">verified query → the right number,</text>
    <text x="400" y="716" font-size="21" font-weight="500" fill="#2b6a52">with its assumptions stated</text>

    <text x="1040" y="628" font-size="30" font-weight="700" fill="#c53b3b">✕ Without it</text>
    <text x="1040" y="662" font-size="21" font-weight="500" fill="#9e3838">agent invents a definition from</text>
    <text x="1040" y="690" font-size="21" font-weight="500" fill="#9e3838">the column name → a confident,</text>
    <text x="1040" y="716" font-size="21" font-weight="500" fill="#9e3838">wrong number in the deck</text>
  </g>
</svg>
</div>
</body>
</html>
